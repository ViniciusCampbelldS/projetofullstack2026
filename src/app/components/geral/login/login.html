<section class="login-page">
  <div class="login-panel">
    <img src="/logo-mar.svg" alt="MAR Metalúrgica" />

    <div class="login-copy">
      <p class="eyebrow">
        Sistema de Gerenciamento
      </p>

      <h1>
        Segurança do Trabalho
      </h1>

      <p>
        Entre com seu CPF e senha. O perfil é definido pela sua conta.
      </p>
    </div>

    <form class="login-form" (ngSubmit)="entrar()">
      <label for="cpf">
        CPF
      </label>

      <input id="cpf" type="text" [(ngModel)]="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
        inputmode="numeric" autocomplete="username" required />

      <label for="senha">
        Senha
      </label>

      <input id="senha" type="password" [(ngModel)]="senha" name="senha" placeholder="Digite sua senha"
        autocomplete="current-password" required />

      @if (erroLogin) {
        <p class="login-error" aria-live="polite">          {{ mensagemErroLogin }}        </p>
      }

      <button class="btn btn-brand" type="submit" [disabled]="carregando">
        <i class="bi bi-box-arrow-in-right"></i>
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>

      <button class="forgot-password" type="button" (click)="mostrarTelefoneTI()">
        Esqueci minha senha
      </button>

      @if (exibirTelefoneTI) {
        <div class="ti-contact">
          <strong>
            Problemas para acessar?
          </strong>

          <p>
            Entre em contato com o setor de TI:
          </p>

          <span>Solicite suporte ao administrador do sistema.</span>
        </div>
      }
    </form>
  </div>
</section>
